<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8f7ac8">
  <title>Music Memory</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">♪</div>
      <div>
        <h1>Music Memory</h1>
        <p>好きな曲を、忘れないように記録。</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="homeView" class="view active">
      <div class="stats">
        <div class="stat-card"><span>登録曲数</span><strong id="songCount">0</strong><small>曲</small></div>
        <div class="stat-card"><span>アーティスト</span><strong id="artistCount">0</strong><small>組</small></div>
        <div class="stat-card"><span>タグ</span><strong id="tagCount">0</strong><small>個</small></div>
      </div>

      <div class="section-title">
        <h2>最近登録した曲</h2>
        <button class="text-btn" data-view="listView">すべて見る →</button>
      </div>
      <div id="recentSongs" class="song-list"></div>
    </section>

    <section id="listView" class="view">
      <div class="section-title">
        <h2 id="listTitle">曲一覧</h2>
      </div>

      <div class="list-toggle" role="tablist" aria-label="表示切替">
        <button type="button" id="songsTab" class="list-tab active">曲</button>
        <button type="button" id="artistsTab" class="list-tab">アーティスト</button>
        <button type="button" id="playlistsTab" class="list-tab">プレイリスト</button>
      </div>

      <div id="playlistSection" class="playlist-section hidden">
        <div class="playlist-toolbar">
          <button type="button" id="createPlaylistBtn" class="primary-btn">＋ プレイリストを作成</button>
          <button type="button" id="youtubeConnectBtn" class="secondary-btn">YouTube連携</button>
        </div>
        <p id="youtubeConnectionStatus" class="youtube-connection-status">YouTube未連携</p>
        <div id="playlistList" class="playlist-list"></div>
      </div>

      <div id="artistSection" class="artist-section hidden">
        <div id="artistList" class="artist-list"></div>
      </div>

      <div class="library-tools">
        <div class="search-row">
          <div class="search-box library-search">
            <span class="search-icon">⌕</span>
            <input id="searchInput" type="search" placeholder="曲名・アーティスト名・作品名を検索">
            <button id="clearSearchBtn" class="clear-search hidden" type="button" aria-label="検索をクリア">×</button>
          </div>
          <button id="filterToggleBtn" class="tool-btn" type="button" aria-expanded="false">
            絞り込み <span id="activeFilterCount" class="filter-count hidden">0</span>
          </button>
        </div>

        <div id="filterPanel" class="filter-panel hidden">
          <div class="filter-grid">
            <select id="genreFilter"><option value="">ジャンル：すべて</option></select>
            <select id="yearFilter"><option value="">年代：すべて</option></select>
            <select id="seasonFilter"><option value="">季節：すべて</option></select>
            <select id="tagFilter"><option value="">タグ：すべて</option></select>
          </div>
          <div class="filter-panel-footer">
            <button id="resetFilterBtn" class="text-reset-btn" type="button">条件をリセット</button>
          </div>
        </div>

        <div class="list-controls">
          <div id="resultCount" class="result-count"></div>

        </div>
      </div>
      <div id="songList" class="song-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">♪</div>
        <h3>曲がありません</h3>
        <p>検索条件を変更するか、新しい曲を登録してください。</p>
      </div>
    </section>

    <section id="playlistDetailView" class="view">
      <div class="section-title">
        <button id="playlistDetailBackBtn" class="back-btn">← プレイリスト一覧に戻る</button>
        <div class="detail-actions"><button id="renamePlaylistBtn" class="secondary-btn">編集</button><button id="deletePlaylistBtn" class="danger-btn">削除</button></div>
      </div>
      <div class="artist-detail-heading playlist-detail-heading">
        <h2 id="playlistDetailTitle"></h2><div id="playlistDetailCount" class="playlist-detail-count"></div>
      </div>
      <div class="playlist-detail-actions">
        <button id="playYoutubePlaylistBtn" class="primary-btn">▶ YouTube Musicで流す</button>
        <button id="addSongsToPlaylistBtn" class="secondary-btn">＋ 曲を追加</button>
      </div>
      <div id="playlistSongList" class="song-list"></div>
      <div id="playlistSongEmpty" class="empty-state hidden"><div class="empty-icon">♫</div><h3>まだ曲がありません</h3><p>「曲を追加」から登録済みの曲を選べます。</p></div>
    </section>

    <section id="artistDetailView" class="view">
      <div class="section-title">
        <button id="artistDetailBackBtn" class="back-btn">← アーティスト一覧に戻る</button>
      </div>
      <div class="artist-detail-heading">
        <h2 id="artistDetailTitle"></h2>
      </div>
      <div id="artistSongList" class="song-list"></div>
      <div id="artistSongEmpty" class="empty-state hidden">
        <div class="empty-icon">♪</div>
        <h3>曲がありません</h3>
      </div>
    </section>

    <section id="formView" class="view">
      <div class="form-header"><button id="formBackBtn" class="back-btn">← 戻る</button></div><span id="formTitle" class="hidden">曲を登録</span>

      <form id="songForm" class="form-card">
        <input type="hidden" id="songId">

        <label>曲名 <span>*</span>
          <input id="title" required maxlength="100" placeholder="例：青と夏">
        </label>

        <label>アーティスト名 <span>*</span>
          <input id="artist" required maxlength="100" placeholder="例：Mrs. GREEN APPLE">
        </label>

        <label>作品名
          <input id="work" maxlength="100" placeholder="例：青と夏">
        </label>

        <div class="two-col">
          <label>年代
            <select id="year">
              <option value="">選択してください</option>
            </select>
          </label>
          <label>ジャンル
            <select id="genre">
              <option value="">選択してください</option>
              <option>J-POP</option><option>ロック</option><option>ポップ</option>
              <option>アニメ</option><option>ゲーム</option><option>ボカロ</option>
              <option>洋楽</option><option>その他</option>
            </select>
          </label>
        </div>

        <label>季節
          <select id="season">
            <option value="">選択してください</option>
            <option>春</option><option>夏</option><option>秋</option><option>冬</option>
        </select>
        </label>

        <label>タグ
          <div class="tag-input-row">
            <input id="tagInput" placeholder="例：ドライブ">
            <button type="button" id="addTagBtn" class="secondary-btn">追加</button>
          </div>
          <div id="selectedTags" class="tag-list"></div>
        </label>

        <label>メモ
          <textarea id="memo" rows="5" maxlength="1000" placeholder="この曲を好きになったきっかけ、思い出、聴きたい場面など"></textarea>
        </label>

        <label>音楽リンク
          <input id="url" type="url" placeholder="https://...">
          <small>YouTube / YouTube MusicなどのURLを登録できます。YouTube動画URLを登録するとプレイリスト同期に利用できます。</small>
        </label>

        <div class="form-actions">
          <button type="button" id="cancelBtn" class="secondary-btn">キャンセル</button>
          <button type="submit" class="primary-btn">保存する</button>
        </div>
      </form>
    </section>

    <section id="detailView" class="view">
      <div class="section-title">
        <button id="detailBackBtn" class="back-btn">← 戻る</button>
        <div class="detail-actions">
          <button id="editBtn" class="secondary-btn">編集</button>
          <button id="deleteBtn" class="danger-btn">削除</button>
        </div>
      </div>
      <article id="detailCard" class="detail-card"></article>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="homeView"><span class="nav-icon">⌂</span><span>ホーム</span></button>
    <button class="nav-btn" data-view="listView"><span class="nav-icon">♫</span><span>ライブラリ</span></button>
    <button class="nav-btn add-nav" data-view="formView"><span class="nav-icon">＋</span><span>登録</span></button>
  </nav>

  <div id="playlistModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="playlistModalTitle">
      <div class="modal-header"><h3 id="playlistModalTitle">プレイリストを作成</h3><button type="button" class="modal-close" data-close-modal>×</button></div>
      <label>プレイリスト名<input id="playlistNameInput" maxlength="50" placeholder="例：ドライブ"></label>
      <label>説明（任意）<textarea id="playlistDescriptionInput" rows="3" maxlength="200" placeholder="このプレイリストについて"></textarea></label>
      <div class="modal-actions"><button type="button" class="secondary-btn" data-close-modal>キャンセル</button><button type="button" id="savePlaylistBtn" class="primary-btn">作成</button></div>
    </div>
  </div>

  <div id="songPickerModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-song-picker></div>
    <div class="modal-card picker-card" role="dialog" aria-modal="true" aria-labelledby="songPickerTitle">
      <div class="modal-header"><h3 id="songPickerTitle">曲を追加</h3><button type="button" class="modal-close" data-close-song-picker>×</button></div>
      <div class="search-box"><input id="playlistSongSearch" type="search" placeholder="曲名・アーティスト名を検索"></div>
      <div id="songPickerList" class="song-picker-list"></div>
      <div class="modal-actions"><button type="button" class="secondary-btn" data-close-song-picker>キャンセル</button><button type="button" id="confirmAddSongsBtn" class="primary-btn">追加する</button></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
